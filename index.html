/* ============================================================
   13. Sincronización con Firebase (opcional)
   ============================================================ */

const SDK = 'https://www.gstatic.com/firebasejs/12.18.0/';
const CLAVE_SYNC = 'cuentas.sync';

let nube = null;              // {ref, F, auth, email}
let estadoNube = 'apagada';   // apagada | conectando | lista | error
let detalleNube = '';
let aplicandoRemoto = false;
let tempSubida = null;

function configNube() {
  try { return JSON.parse(localStorage.getItem(CLAVE_SYNC) || 'null'); } catch (e) { return null; }
}
function leerConfigPegada(txt) {
  const trozo = (txt || '').slice((txt || '').indexOf('{'), (txt || '').lastIndexOf('}') + 1);
  if (!trozo) throw new Error('Ahí no hay ninguna configuración.');
  let cfg;
  try { cfg = JSON.parse(trozo); }
  catch (e) { cfg = Function('"use strict";return (' + trozo + ')')(); }
  if (!cfg || !cfg.apiKey || !cfg.projectId) throw new Error('Falta apiKey o projectId en la configuración.');
  return cfg;
}

async function arrancarNube(cfg, email, pass) {
  estadoNube = 'conectando'; detalleNube = ''; pintar();
  try {
    const [{initializeApp}, A, F] = await Promise.all([
      import(SDK + 'firebase-app.js'),
      import(SDK + 'firebase-auth.js'),
      import(SDK + 'firebase-firestore.js'),
    ]);
    const app = initializeApp(cfg);
    const auth = A.getAuth(app);
    await A.setPersistence(auth, A.browserLocalPersistence);
    let usuario = await new Promise(res => {
      const off = A.onAuthStateChanged(auth, u => { off(); res(u); });
    });
    if (!usuario) {
      if (!email || !pass) throw new Error('Hace falta iniciar sesión con tu correo y contraseña.');
      usuario = (await A.signInWithEmailAndPassword(auth, email, pass)).user;
    }
    const db = F.getFirestore(app);
    const ref = F.doc(db, 'cuentas', usuario.uid);
    nube = {ref, F, auth, email: usuario.email};

    const remoto = await F.getDoc(ref);
    if (remoto.exists() && remoto.data().estado) {
      const d = JSON.parse(remoto.data().estado);
      if ((d.actualizado || 0) > (S.actualizado || 0)) aplicarRemoto(d);
      else await subirYa();
    } else {
      await subirYa();
    }

    F.onSnapshot(ref, snap => {
      const dato = snap.data();
      if (!dato || !dato.estado) return;
      const d = JSON.parse(dato.estado);
      if ((d.actualizado || 0) > (S.actualizado || 0)) {
        aplicarRemoto(d);
        avisar('Actualizado desde tu otro dispositivo.');
      }
    }, err => { estadoNube = 'error'; detalleNube = err.message; pintar(); });

    localStorage.setItem(CLAVE_SYNC, JSON.stringify(cfg));
    estadoNube = 'lista';
    pintar();
    return true;
  } catch (e) {
    nube = null;
    estadoNube = 'error';
    detalleNube = traducirError(e);
    pintar();
    return false;
  }
}
function traducirError(e) {
  const c = (e && e.code) || '';
  if (c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found'))
    return 'Correo o contraseña incorrectos.';
  if (c.includes('unauthorized-domain'))
    return 'Añade este dominio en Firebase → Authentication → Configuración → Dominios autorizados.';
  if (c.includes('permission-denied'))
    return 'Las reglas de Firestore no dejan escribir. Revisa que la colección sea "cuentas".';
  if (c.includes('network'))
    return 'Sin conexión con Firebase.';
  return (e && e.message) || 'No se ha podido conectar.';
}
function aplicarRemoto(d) {
  aplicandoRemoto = true;
  S = {...ESTADO_INICIAL(), ...d};
  guardarLocal();
  aplicandoRemoto = false;
  pintar();
}
async function subirYa() {
  if (!nube) return;
  await nube.F.setDoc(nube.ref, {
    estado: JSON.stringify(S),
    actualizado: S.actualizado || Date.now(),
    dispositivo: navigator.platform || 'desconocido',
  });
}
function subirNube() {
  if (!nube || aplicandoRemoto) return;
  clearTimeout(tempSubida);
  tempSubida = setTimeout(() => {
    subirYa().catch(e => { estadoNube = 'error'; detalleNube = traducirError(e); pintar(); });
  }, 1200);
}

function panelNube() {
  hoja(`<h3>Sincronizar entre móvil y ordenador</h3>
    <p class="det">Necesitas un proyecto de Firebase con Firestore y un usuario de correo y contraseña creado en Authentication.</p>
    <label for="cfgNube">Configuración del proyecto</label>
    <textarea id="cfgNube" rows="5" placeholder='{ "apiKey": "...", "projectId": "...", ... }'
      style="width:100%;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio-s);padding:12px;font-size:13px;font-family:ui-monospace,monospace">${esc(configNube() ? JSON.stringify(configNube(), null, 1) : '')}</textarea>
    <label for="mailNube">Tu correo</label>
    <input type="text" id="mailNube" inputmode="email" autocomplete="username" placeholder="tu@correo.com">
    <label for="passNube">Contraseña</label>
    <input type="password" id="passNube" autocomplete="current-password" placeholder="La del usuario de Firebase">
    <p class="det" style="margin-top:14px">La contraseña no se guarda: la sesión la mantiene Firebase.</p>
    <div class="acciones">
      <button class="btn sec" onclick="cerrarHoja()">Cancelar</button>
      <button class="btn" onclick="conectarNube()">Conectar</button>
    </div>`);
}
async function conectarNube() {
  let cfg;
  try { cfg = leerConfigPegada($('#cfgNube').value); }
  catch (e) { return avisar(e.message); }
  const email = ($('#mailNube').value || '').trim();
  const pass = $('#passNube').value || '';
  cerrarHoja();
  avisar('Conectando con Firebase…');
  const ok = await arrancarNube(cfg, email, pass);
  avisar(ok ? 'Sincronización activada.' : detalleNube);
}
function desconectarNube() {
  if (!confirm('Se dejará de sincronizar en este dispositivo. Los datos siguen en Firebase y aquí. ¿Seguro?')) return;
  try { if (nube) nube.auth.signOut(); } catch (e) {}
  localStorage.removeItem(CLAVE_SYNC);
  nube = null; estadoNube = 'apagada'; detalleNube = '';
  pintar();
  avisar('Sincronización desactivada.');
}

/* ============================================================
   14. Navegación y arranque
   ============================================================ */

let vista = 'Resumen';

function irA(v) {
  vista = v;
  document.querySelectorAll('nav button').forEach(b =>
    b.setAttribute('aria-current', b.dataset.vista === v ? 'true' : 'false'));
  pintar();
  window.scrollTo({top: 0, behavior: 'instant'});

   15. Actualización automática

   hay una versión nueva. Si la hay, recarga (los datos no se tocan).
   ============================================================ */

let buscandoVersion = false;

async function versionPublicada() {
  const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
  if (!r.ok) return null;
  const m = (await r.text()).match(/const VERSION_APP = '([^']+)'/);
  return m ? m[1] : null;
}
function ocupado() {
  return $('#capaHoja').innerHTML.trim() !== '' || ficheroEnEspera ||
    ['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement || {}).tagName);
}
async function comprobarActualizacion() {
  if (buscandoVersion || !navigator.onLine || location.protocol === 'file:') return;
  buscandoVersion = true;
  try {
    const v = await versionPublicada();
    if (!v || v === VERSION_APP) return;
    // Evita bucles si el servidor aún sirve la versión vieja en caché
    let intentada = null;
    try { intentada = sessionStorage.getItem('cuentas.recargada'); } catch (e) {}
    if (intentada === v) return;
    try { sessionStorage.setItem('cuentas.recargada', v); } catch (e) {}
    guardarLocal();
    if (ocupado()) {
      avisar('Hay una versión nueva de la app.', {txt: 'Actualizar', fn: 'location.reload()'});
    } else {
      location.reload();
    }
  } catch (e) {
    // sin conexión o GitHub no responde: se intentará la próxima vez
  } finally {
    buscandoVersion = false;
  }
}
comprobarActualizacion();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') comprobarActualizacion(); });
window.addEventListener('pageshow', e => { if (e.persisted) comprobarActualizacion(); });

/* ============================================================
   16. Copia cifrada en Google Drive
   Los datos se cifran aquí (AES-GCM 256, clave sacada de tu contraseña
   con PBKDF2) y a Drive solo llega un texto ilegible. Lo sube un pequeño
   script de Google Apps Script que vive en tu propia cuenta.
   ============================================================ */

const CLAVE_DRIVE = 'cuentas.drive';
const ITER_PBKDF2 = 600000;
const CADA_HORAS = 20;        // copia diaria: se hace al abrir la app si la última tiene más de 20 h

var drive = leerDrive();   // var: puede consultarse antes de llegar aquí
var subiendoDrive = false;
var asistente = null;         // datos del asistente de configuración mientras está abierto

function leerDrive() {
  try { return JSON.parse(localStorage.getItem(CLAVE_DRIVE) || 'null'); } catch (e) { return null; }
}
function guardarDrive() {
  try { drive ? localStorage.setItem(CLAVE_DRIVE, JSON.stringify(drive)) : localStorage.removeItem(CLAVE_DRIVE); } catch (e) {}
}

/* ---------- cifrado ---------- */

const aB64 = buf => {
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
};
const deB64 = t => Uint8Array.from(atob(t), c => c.charCodeAt(0));

async function claveDesdePassword(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: ITER_PBKDF2}, base, 256);
  return aB64(bits);
}
async function claveAes(b64, uso) {
  return crypto.subtle.importKey('raw', deB64(b64), 'AES-GCM', false, [uso]);
}
async function cifrar(texto, claveB64, saltB64) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const k = await claveAes(claveB64, 'encrypt');
  const datos = await crypto.subtle.encrypt({name: 'AES-GCM', iv}, k, new TextEncoder().encode(texto));
  return JSON.stringify({app: 'cuentas', v: 1, kdf: 'PBKDF2-SHA256', it: ITER_PBKDF2, salt: saltB64, iv: aB64(iv), datos: aB64(datos)});
}
async function descifrar(paquete, pass) {
  const p = typeof paquete === 'string' ? JSON.parse(paquete) : paquete;
  if (!p || p.app !== 'cuentas' || !p.datos) throw new Error('Ese archivo no es una copia de Calderilla.');
  const claveB64 = await claveDesdePassword(pass, deB64(p.salt));
  try {
    const k = await claveAes(claveB64, 'decrypt');
    const plano = await crypto.subtle.decrypt({name: 'AES-GCM', iv: deB64(p.iv)}, k, deB64(p.datos));
    return {texto: new TextDecoder().decode(plano), claveB64, salt: p.salt};
  } catch (e) {
    throw new Error('Contraseña incorrecta.');
  }
}

/* ---------- comunicación con el script de Drive ---------- */

async function llamarDrive(cfg, cuerpo) {
  let r;
  try {
    // text/plain para que el navegador no haga petición previa (Apps Script no la admite)
    r = await fetch(cfg.url, {method: 'POST', body: JSON.stringify({clave: cfg.clave, ...cuerpo})});
  } catch (e) {
    throw new Error('No se ha podido conectar con tu script de Google. Revisa la dirección y que tengas conexión.');
  }
  let d;
  try { d = await r.json(); } catch (e) {
    throw new Error('El script no responde bien. ¿Lo implementaste con acceso para "Cualquier usuario"?');
  }
  if (!d.ok) throw new Error(d.error === 'clave' ? 'La clave del script no coincide con la de la app.' : (d.error || 'Error en el script de Drive.'));
  return d;
}

function hoyHora() {
  const d = new Date();
  return hoyISO() + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
}

async function copiaDrive(manual) {
  if (!drive || !drive.claveAes || subiendoDrive) return;
  if (!S.movs.length && !(S.recibos || []).length) { if (manual) avisar('Todavía no hay datos que copiar.'); return; }
  subiendoDrive = true;
  if (manual) avisar('Cifrando y subiendo a Drive…');
  try {
    const paquete = await cifrar(JSON.stringify(S), drive.claveAes, drive.salt);
    const r = await llamarDrive(drive, {accion: 'subir', fecha: hoyHora(), datos: paquete});
    drive.ultima = Date.now();
    drive.ultimaDatos = S.actualizado || 0;
    drive.total = r.total;
    drive.error = '';
    guardarDrive();
    if (manual) avisar('Copia cifrada guardada en tu Drive.');
  } catch (e) {
    drive.error = e.message;
    guardarDrive();
    if (manual) avisar(e.message);
  } finally {
    subiendoDrive = false;
    if (vista === 'Ajustes') pintar();
  }
}

// Se llama al abrir la app y al volver a ella
function copiaDriveSiToca() {
  if (!drive || !drive.claveAes || !navigator.onLine) return;
  const hace = Date.now() - (drive.ultima || 0);
  const sinCambios = (S.actualizado || 0) <= (drive.ultimaDatos || 0);
  if (hace < CADA_HORAS * 3600 * 1000) return;
  if (sinCambios && hace < 7 * 24 * 3600 * 1000) return;   // sin cambios: basta una vez por semana
  copiaDrive(false);
}

/* ---------- textos y asistente ---------- */

function cuandoFue(ms) {
  if (!ms) return 'nunca';
  const min = Math.round((Date.now() - ms) / 60000);
  if (min < 2) return 'hace un momento';
  if (min < 60) return 'hace ' + min + ' min';
  const d = new Date(ms);
  const hora = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  if (d.toDateString() === new Date().toDateString()) return 'hoy a las ' + hora;
  return fechaCorta(d.toISOString().slice(0, 10)) + ' a las ' + hora;
}

function codigoScript(clave) {
  return `// Calderilla: guarda en tu Drive las copias cifradas que manda la app.
// Las copias llegan ya cifradas: este script no puede leer tus datos.
const CLAVE = '${clave}';
const CARPETA = 'Calderilla - copias cifradas';
const GUARDAR = 30;

function carpeta_() {
  const it = DriveApp.getFoldersByName(CARPETA);
  return it.hasNext() ? it.next() : DriveApp.createFolder(CARPETA);
}
function responder_(o) {
  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);
}
function copias_(f) {
  const lista = [];
  const it = f.getFiles();
  while (it.hasNext()) {
    const x = it.next();
    if (/^cuentas-.*\\.cifrado$/.test(x.getName())) lista.push(x);
  }
  return lista.sort((a, b) => b.getName().localeCompare(a.getName()));
}
function doPost(e) {
  try {
    const d = JSON.parse(e.postData.contents);
    if (d.clave !== CLAVE) return responder_({ok: false, error: 'clave'});
    const f = carpeta_();
    if (d.accion === 'probar') return responder_({ok: true});
    if (d.accion === 'subir') {
      const nombre = 'cuentas-' + String(d.fecha).replace(/[^0-9_-]/g, '') + '.cifrado';
      f.createFile(nombre, d.datos, MimeType.PLAIN_TEXT);
      const lista = copias_(f);
      lista.slice(GUARDAR).forEach(x => x.setTrashed(true));
      return responder_({ok: true, nombre: nombre, total: Math.min(lista.length, GUARDAR)});
    }
    if (d.accion === 'listar') {
      return responder_({ok: true, copias: copias_(f).map(x => ({nombre: x.getName(), tam: x.getSize()}))});
    }
    if (d.accion === 'bajar') {
      const lista = copias_(f);
      const x = d.nombre ? lista.find(y => y.getName() === d.nombre) : lista[0];
      if (!x) return responder_({ok: false, error: 'No hay copias en Drive.'});
      return responder_({ok: true, nombre: x.getName(), datos: x.getBlob().getDataAsString()});
    }
    return responder_({ok: false, error: 'Acción desconocida'});
  } catch (err) {
    return responder_({ok: false, error: String(err)});
  }
}
`;
}

function claveAleatoria() {
  const b = crypto.getRandomValues(new Uint8Array(18));
  return aB64(b).replace(/[+/=]/g, '').slice(0, 22);
}

async function copiarTexto(texto, que) {
  try {
    await navigator.clipboard.writeText(texto);
  } catch (e) {
    const t = document.createElement('textarea');
    t.value = texto; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select();
    try { document.execCommand('copy'); } catch (e2) {}
    t.remove();
  }
  avisar((que || 'Texto') + ' copiado.');
}

function urlValida(u) {
  return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u) ||
         /^https:\/\/script\.google\.com\/a\/macros\/[\w.-]+\/s\/[\w-]+\/exec$/.test(u);
}

    const salt = crypto.getRandomValues(new Uint8Array(16));
    drive = {...cfg, salt: aB64(salt), claveAes: await claveDesdePassword(pass, salt), ultima: 0, ultimaDatos: 0, error: ''};
    guardarDrive();
    asistente = null;
    cerrarHoja();

    const {texto} = await descifrar(r.datos, pass);
    const d = JSON.parse(texto);
    if (!Array.isArray(d.movs)) throw new Error('La copia está vacía o dañada.');
    if (!confirm(`Esta copia tiene ${d.movs.length} movimientos. Se sustituirá lo que hay ahora en este dispositivo. ¿Seguro?`)) return;
    S = {...ESTADO_INICIAL(), ...d};
    guardar(); cerrarHoja(); pintar();
    avisar('Copia recuperada.');
  } catch (e) {
    avisar(e.message);
  }
}

function desconectarDrive() {
  if (!confirm('Este dispositivo dejará de hacer copias en Drive. Las copias que ya hay siguen allí. ¿Seguro?')) return;
  drive = null;
  guardarDrive();
  pintar();
  avisar('Drive desconectado en este dispositivo.');
}

copiaDriveSiToca();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') copiaDriveSiToca(); });
/* ============================================================
   17. Bloqueo con Face ID / Touch ID y PIN
   Face ID se pide con una llave de acceso (WebAuthn) guardada en el
   iPhone. El PIN es la alternativa si Face ID falla.
   ============================================================ */

const CLAVE_BLOQUEO = 'calderilla.bloqueo';
const MINUTOS_SIN_PEDIR = 1;     // al volver a la app antes de 1 minuto no vuelve a pedirlo
var candado = (() => { try { return JSON.parse(localStorage.getItem(CLAVE_BLOQUEO) || 'null'); } catch (e) { return null; } })();
let fallosPin = 0;
let salidaEn = 0;

function guardarCandado() {
  try { candado ? localStorage.setItem(CLAVE_BLOQUEO, JSON.stringify(candado)) : localStorage.removeItem(CLAVE_BLOQUEO); } catch (e) {}
}
const b64url = buf => aB64(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const deB64url = t => deB64(t.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((t.length + 3) % 4));

async function hashPin(pin, saltB64) {
  return claveDesdePasswordRapida(pin, deB64(saltB64));
}
async function claveDesdePasswordRapida(pass, salt) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveBits']);
  return aB64(await crypto.subtle.deriveBits({name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 200000}, base, 256));
}
function hayFaceId() {
  return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
}

/* ---------- pantalla de bloqueo ---------- */

function bloquear() {
  if (!candado || !candado.activo) return;
  document.documentElement.classList.add('bloqueada');
  cerrarHoja();
  const cap = $('#candado');
  cap.innerHTML = `<div class="candado-caja">
      <img src="apple-touch-icon.png" alt="" class="candado-logo">
      <h1>Calderilla</h1>
      <p id="candadoMsg">${candado.credId ? 'Usa Face ID para entrar' : 'Escribe tu PIN'}</p>
      ${candado.credId ? `<button class="btn" id="btnFace" onclick="desbloquearFace()">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M9 9.5v1M15 9.5v1M12 9.5v4h-1M9.5 16a3.5 3.5 0 0 0 5 0"/></svg>
        Desbloquear con Face ID</button>` : ''}
      <div class="candado-pin ${candado.credId ? 'oculto' : ''}" id="zonaPin">
        <input type="password" id="pinEntrada" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="PIN" autocomplete="off"
          onkeydown="if(event.key==='Enter')desbloquearPin()">
        <button class="btn" onclick="desbloquearPin()">Entrar</button>
      </div>
      ${candado.credId ? `<button class="candado-link" id="linkPin" onclick="mostrarPin()">Usar el PIN</button>` : ''}
      <button class="candado-link" onclick="olvidePin()">He olvidado el PIN</button>
    </div>`;
  cap.classList.remove('oculto');
  if (!candado.credId) setTimeout(() => $('#pinEntrada') && $('#pinEntrada').focus(), 200);
}

function mostrarPin() {
  const zona = $('#zonaPin'); if (zona) zona.classList.remove('oculto');
  const link = $('#linkPin'); if (link) link.remove();
  const caja = $('#pinEntrada'); if (caja) caja.focus();
}

function abrirCandado() {
  document.documentElement.classList.remove('bloqueada', 'tapada');
  $('#candado').classList.add('oculto');
  $('#candado').innerHTML = '';
  fallosPin = 0;
  try { sessionStorage.setItem('calderilla.abierta', String(Date.now())); } catch (e) {}
  pintar();
}

async function desbloquearFace(auto) {
  const msg = $('#candadoMsg');
  try {
    const cred = await navigator.credentials.get({publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)),
      rpId: location.hostname,
      allowCredentials: [{type: 'public-key', id: deB64url(candado.credId)}],
      userVerification: 'required',
      timeout: 60000,
    }});
    const flags = new Uint8Array(cred.response.authenticatorData)[32];
    if (!(flags & 0x04)) throw new Error('sin verificar');   // bit UV: Face ID / código superado
    abrirCandado();
  } catch (e) {
    if (auto) return;   // el intento automático al abrir puede no estar permitido: queda el botón
    if (msg) msg.textContent = 'No se ha podido comprobar. Inténtalo otra vez o usa el PIN.';
    const zona = $('#zonaPin'); if (zona) zona.classList.remove('oculto');
    const link = $('#linkPin'); if (link) link.remove();
  }
}

async function desbloquearPin() {
  const caja = $('#pinEntrada');
  const pin = (caja.value || '').trim();
  if (!pin) return;
  if (fallosPin >= 5) {
    const espera = Math.min(300, 15 * 2 ** (fallosPin - 5));
    if (Date.now() - (candado.ultimoFallo || 0) < espera * 1000) {
      $('#candadoMsg').textContent = `Demasiados intentos. Espera ${espera} segundos.`;
      return;
    }
  }
  if (await hashPin(pin, candado.pinSalt) === candado.pinHash) return abrirCandado();
  fallosPin++;
  candado.ultimoFallo = Date.now();
  caja.value = '';
  $('#candadoMsg').textContent = 'PIN incorrecto.';
  caja.animate([{transform: 'translateX(-8px)'}, {transform: 'translateX(8px)'}, {transform: 'translateX(0)'}], {duration: 220, iterations: 2});
}

function olvidePin() {
  $('#candadoMsg').innerHTML = 'Sin el PIN ni Face ID no se puede entrar. Puedes <b>borrar los datos de este dispositivo</b> y recuperarlos después desde tu copia de Drive.';
  const b = document.createElement('button');
  b.className = 'btn peligro'; b.style.marginTop = '14px';
  b.textContent = 'Borrar datos y empezar';
  b.onclick = () => {
    if (!confirm('Se borrarán los datos de este dispositivo. Las copias de Drive no se tocan. ¿Seguro?')) return;
    S = ESTADO_INICIAL(); guardarLocal();
    candado = null; guardarCandado();
    abrirCandado();
    irA('Ajustes');
    avisar('Datos borrados. Recupéralos con «Ya tengo copias» en Drive.');
  };
  $('.candado-caja').appendChild(b);
}

/* ---------- activar y desactivar desde Ajustes ---------- */

function bloqueAjustesSeguridad() {
  const activo = candado && candado.activo;
  return `<h2>Seguridad</h2>
    <div class="tarjeta lista-aj">
      <button class="aj" onclick="${activo ? 'quitarCandado()' : 'ponerCandado()'}">
        <div><b>${activo ? (candado.credId ? 'Face ID y PIN activados' : 'PIN activado') : 'Pedir Face ID al entrar'}</b>
          <small>${activo ? 'La app se bloquea al abrirla y al volver a ella pasado ' + MINUTOS_SIN_PEDIR + ' minuto. Toca para desactivarlo.' : 'Nadie que coja tu móvil podrá ver tus cuentas. Si Face ID falla, entras con un PIN.'}</small></div>
        <span class="sw" aria-pressed="${!!activo}"></span>
      </button>
      ${activo ? '<button class="aj" onclick="ponerCandado()"><div><b>Cambiar el PIN</b><small>También vuelve a registrar Face ID</small></div><span>›</span></button>' : ''}
    </div>`;
}

function ponerCandado() {
  const caja = 'width:100%;background:var(--tarjeta);border:1px solid var(--linea);border-radius:var(--radio-s);padding:12px 13px;font-size:20px;letter-spacing:.3em;text-align:center';
  hoja(`<h3>Bloquear la app</h3>
    <p class="det">Primero elige un PIN de 4 a 8 números. Sirve para entrar si Face ID falla. Después el iPhone te pedirá Face ID para registrarlo.</p>
    <label for="pin1">PIN</label>
    <input type="password" id="pin1" inputmode="numeric" pattern="[0-9]*" maxlength="8" style="${caja}" autocomplete="new-password">
    <label for="pin2">Repite el PIN</label>
    <input type="password" id="pin2" inputmode="numeric" pattern="[0-9]*" maxlength="8" style="${caja}" autocomplete="new-password">
    <div class="acciones"><button class="btn sec" onclick="cerrarHoja()">Cancelar</button>
      <button class="btn" id="btnCandado" onclick="guardarNuevoCandado()">${hayFaceId() ? 'Seguir y activar Face ID' : 'Activar'}</button></div>`);
  setTimeout(() => $('#pin1') && $('#pin1').focus(), 250);
}

async function guardarNuevoCandado() {
  const p1 = $('#pin1').value.trim(), p2 = $('#pin2').value.trim();
  if (!/^\d{4,8}$/.test(p1)) return avisar('El PIN tiene que tener entre 4 y 8 números.');
  if (p1 !== p2) return avisar('Los dos PIN no coinciden.');
  if (/^(\d)\1+$/.test(p1) || '0123456789'.includes(p1) || '9876543210'.includes(p1)) return avisar('Ese PIN es demasiado fácil. Elige otro.');
  const salt = aB64(crypto.getRandomValues(new Uint8Array(16)));
  const nuevo = {activo: true, pinSalt: salt, pinHash: await hashPin(p1, salt), credId: null};
  if (hayFaceId()) {
    try {
      const cred = await navigator.credentials.create({publicKey: {
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        rp: {name: 'Calderilla', id: location.hostname},
        user: {id: crypto.getRandomValues(new Uint8Array(16)), name: 'Calderilla', displayName: 'Calderilla'},
        pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
        authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'preferred'},
        timeout: 60000,
      }});
      nuevo.credId = b64url(cred.rawId);
    } catch (e) {
      avisar('Face ID no se ha podido activar. Queda activado solo el PIN.');
    }
  }
  candado = nuevo;
  guardarCandado();
  try { sessionStorage.setItem('calderilla.abierta', String(Date.now())); } catch (e) {}
  cerrarHoja(); pintar();
  if (nuevo.credId) avisar('Listo. La próxima vez que abras la app te pedirá Face ID.');
  else if (!hayFaceId()) avisar('PIN activado.');
}

function quitarCandado() {
  if (!confirm('La app dejará de pedir Face ID y PIN. ¿Seguro?')) return;
  candado = null;
  guardarCandado();
  pintar();
  avisar('Bloqueo desactivado. Puedes borrar la llave «Calderilla» en Ajustes del iPhone → Contraseñas.');
}

/* ---------- cuándo se bloquea ---------- */

document.addEventListener('visibilitychange', () => {
  if (!candado || !candado.activo) return;
  if (document.visibilityState === 'hidden') {
    salidaEn = Date.now();
    document.documentElement.classList.add('tapada');   // que no se vean cifras en el selector de apps
  } else {
    if (Date.now() - salidaEn > MINUTOS_SIN_PEDIR * 60000 && !document.documentElement.classList.contains('bloqueada')) bloquear();
    else document.documentElement.classList.remove('tapada');
  }
});

(function arrancarCandado() {
  if (!candado || !candado.activo) { document.documentElement.classList.remove('bloqueada'); return; }
  let abierta = 0;
  try { abierta = +sessionStorage.getItem('calderilla.abierta') || 0; } catch (e) {}
  // tras una recarga por actualización no vuelve a pedirlo si acabas de entrar
  if (Date.now() - abierta < MINUTOS_SIN_PEDIR * 60000) { document.documentElement.classList.remove('bloqueada'); return; }
  bloquear();
  if (candado.credId) desbloquearFace(true);   // en algunos iPhone salta solo; si no, se pulsa el botón
})();

</script>
</body>
</html>
